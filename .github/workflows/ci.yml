name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint src (fail on errors)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path src -Recurse -Severity Information,Warning,Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Lint build scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path build -Recurse -Severity Error
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

  validate-catalog:
    name: Validate Control Catalog JSON
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate all control JSON files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path catalog -Filter '*.json' -Recurse
          $errors = 0
          foreach ($f in $files) {
            try {
              $controls = Get-Content $f.FullName -Raw | ConvertFrom-Json
              # Validate required fields on each control
              foreach ($ctrl in $controls) {
                if (-not $ctrl.id)               { throw "Missing 'id' in $($f.Name)" }
                if (-not $ctrl.title)            { throw "Missing 'title' in $($f.Name)" }
                if (-not $ctrl.assessmentStatus) { throw "Missing 'assessmentStatus' in $($f.Name)" }
              }
              Write-Host "OK  $($f.Name) ($($controls.Count) controls)" -ForegroundColor Green
            } catch {
              Write-Host "ERR $($f.Name): $($_.Exception.Message)" -ForegroundColor Red
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }

  pester-tests:
    name: Pester Unit Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.0.0

      - name: Run unit tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path            = 'tests/Unit'
          $config.Output.Verbosity    = 'Detailed'
          $config.TestResult.Enabled  = $true
          $config.TestResult.OutputPath = 'tests/results/pester-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          New-Item -ItemType Directory -Path tests/results -Force | Out-Null
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Host "FAILED: $($result.FailedCount) test(s) failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "PASSED: $($result.PassedCount) test(s)" -ForegroundColor Green

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: tests/results/
