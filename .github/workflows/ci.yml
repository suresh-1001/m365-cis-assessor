name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Lint src
        shell: pwsh
        run: |
          $r = Invoke-ScriptAnalyzer -Path src -Recurse -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

  validate-catalog:
    name: Validate Control Catalog JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path catalog -Filter '*.json' -Recurse
          $errors = 0
          foreach ($f in $files) {
            try {
              $controls = Get-Content $f.FullName -Raw | ConvertFrom-Json
              foreach ($ctrl in $controls) {
                if (-not $ctrl.id)               { throw "Missing id in $($f.Name)" }
                if (-not $ctrl.title)            { throw "Missing title in $($f.Name)" }
                if (-not $ctrl.assessmentStatus) { throw "Missing assessmentStatus in $($f.Name)" }
              }
              Write-Host "OK $($f.Name) ($($controls.Count) controls)"
            } catch {
              Write-Host "ERR $($f.Name): $($_.Exception.Message)"
              $errors++
            }
          }
          if ($errors -gt 0) { exit 1 }

  pester-tests:
    name: Pester Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install modules
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -Force -MinimumVersion 5.0.0
          Install-Module Microsoft.Graph.Authentication -Scope CurrentUser -Force
          Install-Module ExchangeOnlineManagement -Scope CurrentUser -Force
          Install-Module MicrosoftTeams -Scope CurrentUser -Force
          Install-Module PnP.PowerShell -Scope CurrentUser -Force
      - name: Run tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/Unit'
          $config.Output.Verbosity = 'Detailed'
          New-Item -ItemType Directory -Path tests/results -Force | Out-Null
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) { exit 1 }
