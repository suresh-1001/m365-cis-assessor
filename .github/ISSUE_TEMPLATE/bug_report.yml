name: Bug report
description: File a bug report
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including any error output.
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: control
    attributes:
      label: Which control(s) are affected?
      placeholder: e.g. CIS.M365.1.1.1
  - type: input
    id: ps-version
    attributes:
      label: PowerShell version
      placeholder: e.g. 7.4.1
